name: История по годам

on:
  schedule:
    - cron: '47 * * * *'   # каждый час, пока все годы не скачаются
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_history.py', 'data/hist/years.txt']

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Докачать недостающие годы
        continue-on-error: true
        env:
          HIST_MINUTES: '28'
        run: python3 tools/fetch_history.py

      - name: Сохранить историю в репозиторий
        run: |
          git add data/hist
          if git diff --cached --quiet; then
            echo "Новой истории нет"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "История на $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi
